services:
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"
    environment:
      VITE_API_TARGET: "http://backend:8080"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    image: golang:1.26
    working_dir: /app/backend
    command: go run ./cmd/server
    environment:
      PORT: "8080"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      MOCK_OPENROUTER: "${MOCK_OPENROUTER:-false}"
      LM_STUDIO_MODEL: "${LM_STUDIO_MODEL:-}"
      LM_STUDIO_BASE_URL: "${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      LM_STUDIO_API_TOKEN: "${LM_STUDIO_API_TOKEN:-}"
      TTS_BACKEND_URL: "${TTS_BACKEND_URL:-http://tts:8091}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./backend:/app/backend
      - ./scenarios:/app/scenarios:ro

  tts:
    build: ./tts
    volumes:
      - tts_voices:/app/voices
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2m

volumes:
  frontend_node_modules:
  tts_voices:
