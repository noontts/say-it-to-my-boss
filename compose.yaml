services:
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"
    environment:
      VITE_API_TARGET: "http://backend:8080"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    image: golang:1.26
    working_dir: /app/backend
    command: go run ./cmd/server
    environment:
      PORT: "8080"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./backend:/app/backend
      - ./scenarios:/app/scenarios:ro

volumes:
  frontend_node_modules:
